# see https://coolify.io/docs/get-started/contribute/service

services:
  ryot-db:
    image: postgres:${POSTGRES_VERSION:-16}-alpine # at-least version 15 is required
    restart: unless-stopped
    container_name: ryot-db
    volumes:
      - /data/ryot/postgres:/var/lib/postgresql/data
    environment:
      - TZ=Europe/Amsterdam
      - POSTGRES_DB=${SERVICE_USER_POSTGRESDB:-ryot}
      - POSTGRES_USER=${SERVICE_USER_POSTGRESUSER:-ryot}
      - POSTGRES_PASSWORD=${SERVICE_PASSWORD_POSTGRESPASSWORD}
  ryot:
    image: ignisda/ryot:${RYOT_VERSION:-v9}
    #  or: ghcr.io/ignisda/ryot:v9
    pull_policy: always
    container_name: ryot
    restart: unless-stopped
    environment:
      # see https://coolify.io/docs/knowledge-base/docker/compose#coolify-s-magic-environment-variables
      SERVICE_FQDN_RYOT_8000:  # makes sure the routing works in Coolify,

      # anime and manga

      # Settings related to Anilist > The preferred language for media from this source.
      ANIME_AND_MANGA_ANILIST_PREFERRED_LANGUAGE: ${ANIME_AND_MANGA_ANILIST_PREFERRED_LANGUAGE:-native}
      # Settings related to MAL. > The client ID to be used for the MAL API.
      ANIME_AND_MANGA_MAL_CLIENT_ID: ${ANIME_AND_MANGA_MAL_CLIENT_ID:-}

      # audio books

      # Settings related to Audible. > Settings related to locale for making requests Audible.
      AUDIO_BOOKS_AUDIBLE_LOCALE: ${AUDIO_BOOKS_AUDIBLE_LOCALE:-us}

      # books

      # Settings related to Google Books. > The API key to be used for the Google Books API.
      BOOKS_GOOGLE_BOOKS_API_KEY: ${BOOKS_GOOGLE_BOOKS_API_KEY:-}
      # Settings related to Hardcover. > The API key to be used.
      BOOKS_HARDCOVER_API_KEY: ${BOOKS_HARDCOVER_API_KEY:-}
      # Settings related to Openlibrary. > The cover image sizes to fetch from Openlibrary. Possible values are S, M and L.
      BOOKS_OPENLIBRARY_COVER_IMAGE_SIZE: ${BOOKS_OPENLIBRARY_COVER_IMAGE_SIZE:-M}

      # database

      # The Postgres database connection string.
      # Format described in https://www.sea-ql.org/SeaORM/docs/install-and-config/connection/#postgres.
      DATABASE_URL: "postgres://${POSTGRES_USER:-ryot}${SERVICE_PASSWORD_POSTGRESPASSWORD}@ryot-db:5432/${SERVICE_USER_POSTGRESDB:-ryot}"

      # calling home

      # Whether to disable telemetry.
      DISABLE_TELEMETRY: ${DISABLE_TELEMETRY:-"true"}

      # file storage

      # The access key ID for the S3-compatible file storage. **Required** to enable file storage.
      FILE_STORAGE_S3_ACCESS_KEY_ID: ${FILE_STORAGE_S3_ACCESS_KEY_ID:-}
      # The name of the S3-compatible bucket. **Required** to enable file storage.
      FILE_STORAGE_S3_BUCKET_NAME: ${FILE_STORAGE_S3_BUCKET_NAME:-}
      # The region for the S3 compatible file storage.
      FILE_STORAGE_S3_REGION: ${FILE_STORAGE_S3_REGION:-us-east-1}
      # The secret access key for the S3-compatible file storage. **Required** to enable file storage.
      FILE_STORAGE_S3_SECRET_ACCESS_KEY: ${FILE_STORAGE_S3_SECRET_ACCESS_KEY:-}
      # The endpoint for the S3-compatible file storage.
      FILE_STORAGE_S3_URL: ${FILE_STORAGE_S3_URL:-}

      # frontend

      # Used as the base URL when generating item links for the frontend. I.e. `"https://app.ryot.io"`.
      FRONTEND_URL: ${FRONTEND_URL:-https://app.ryot.io}

      # A message to be displayed on the dashboard.
      FRONTEND_DASHBOARD_MESSAGE: ${FRONTEND_DASHBOARD_MESSAGE:-}
      # The button label for OIDC authentication.
      FRONTEND_OIDC_BUTTON_LABEL: ${FRONTEND_OIDC_BUTTON_LABEL:-Continue with OpenID Connect}

      # frontend > Umami analytics
      # For example: `https://umami.is/script.js`.
      FRONTEND_UMAMI_SCRIPT_URL: ${FRONTEND_UMAMI_SCRIPT_URL:-}
      # The website ID for Umami analytics.
      FRONTEND_UMAMI_WEBSITE_ID: ${FRONTEND_UMAMI_WEBSITE_ID:-}

      # movies and shows

      # TMDB > The API access token to be used for TMDB.
      MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN: ${MOVIES_AND_SHOWS_TMDB_ACCESS_TOKEN:-}
      # TMDB > The locale to be used when making requests to TMDB.
      MOVIES_AND_SHOWS_TMDB_LOCALE: ${MOVIES_AND_SHOWS_TMDB_LOCALE:-en}

      # music

      # Spotify > The client ID for the Spotify API.
      MUSIC_SPOTIFY_CLIENT_ID: ${MUSIC_SPOTIFY_CLIENT_ID:-}
      # Spotify > The client secret for the Spotify API.
      MUSIC_SPOTIFY_CLIENT_SECRET: ${MUSIC_SPOTIFY_CLIENT_SECRET:-}

      # podcasts

      # iTunes > The locale to use for making requests to iTunes API.
      PODCASTS_ITUNES_LOCALE: ${PODCASTS_ITUNES_LOCALE:-en_us}
      # Listen Notes > The access token for the Listennotes API.
      PODCASTS_LISTENNOTES_API_TOKEN: ${PODCASTS_LISTENNOTES_API_TOKEN:-}

      # scheduler

      # Run frequent cron tasks (syncing integrations, workout revisions) every `n` minutes.
      SCHEDULER_FREQUENT_CRON_JOBS_EVERY_MINUTES: ${SCHEDULER_FREQUENT_CRON_JOBS_EVERY_MINUTES:-5}
      # Hours cron component for infrequent cron jobs (cleaning up data, refreshing calendar).
      SCHEDULER_INFREQUENT_CRON_JOBS_HOURS_FORMAT: ${SCHEDULER_INFREQUENT_CRON_JOBS_HOURS_FORMAT:-0}

      # server

      # Timezone to be used for cron jobs. Accepts values according to the IANA database. Defaults to GMT.
      TZ: ${TZ:-Europe/Amsterdam}
      # An access token that can be used for admin operations.
      SERVER_ADMIN_ACCESS_TOKEN: ${SERVICE_PASSWORD_RYOTADMIN}
      # The host address to bind the backend server to.
      SERVER_BACKEND_HOST: ${SERVER_BACKEND_HOST:-0.0.0.0}
      # The port number to bind the backend server to.
      SERVER_BACKEND_PORT: ${SERVER_BACKEND_PORT:-5000}
      # An array of URLs for CORS.
      SERVER_CORS_ORIGINS: ${SERVER_CORS_ORIGINS:-}
      # Disable all background jobs.
      SERVER_DISABLE_BACKGROUND_JOBS: ${SERVER_DISABLE_BACKGROUND_JOBS:-"false"}
      # Whether the graphql playground will be enabled.
      SERVER_GRAPHQL_PLAYGROUND_ENABLED: ${SERVER_GRAPHQL_PLAYGROUND_ENABLED:-"true"}
      # Whether this is a demo instance.
      SERVER_IS_DEMO_INSTANCE: ${SERVER_IS_DEMO_INSTANCE:-"false"}
      # The maximum file size in MB for user uploads.
      SERVER_MAX_FILE_SIZE_MB: ${SERVER_MAX_FILE_SIZE_MB:-70}
      # The hours in which a media can be marked as seen again for a user. This
      # is used so that the same media can not be used marked as started when
      # it has been already marked as seen in the last `n` hours.
      SERVER_PROGRESS_UPDATE_THRESHOLD: ${SERVER_PROGRESS_UPDATE_THRESHOLD:-2}
      # Number of seconds to sleep before starting the server.
      SERVER_SLEEP_BEFORE_STARTUP_SECONDS: ${SERVER_SLEEP_BEFORE_STARTUP_SECONDS:-0}

      # OpenID Connect
      # The client ID for OIDC authentication.
      SERVER_OIDC_CLIENT_ID: ${SERVER_OIDC_CLIENT_ID:-}
      # The client secret for OIDC authentication.
      SERVER_OIDC_CLIENT_SECRET: ${SERVER_OIDC_CLIENT_SECRET:-}
      # The issuer URL for OIDC authentication. I.e. `https://accounts.google.com`.
      SERVER_OIDC_ISSUER_URL: ${SERVER_OIDC_ISSUER_URL:-}

      # pro
      # The pro key assigned to the user.
      SERVER_PRO_KEY: ${UNKEY_KEY_SECRET:-}
      # The key server id
      UNKEY_API_ID: ${UNKEY_KEY_ID:-}

      # importer

      # The client ID for the Trakt importer. **Required** to enable Trakt importer.
      SERVER_IMPORTER_TRAKT_CLIENT_ID: ${SERVER_IMPORTER_TRAKT_CLIENT_ID:-}

      # mailer

      SERVER_SMTP_MAILBOX: ${SERVER_SMTP_MAILBOX:-Ryot <no-reply@mailer.io>}
      SERVER_SMTP_PASSWORD: ${SERVER_SMTP_PASSWORD:-}
      SERVER_SMTP_SERVER: ${SERVER_SMTP_SERVER:-}
      SERVER_SMTP_USER: ${SERVER_SMTP_USER:-}

      # users & accounts

      USERS_ALLOW_REGISTRATION: ${USERS_ALLOW_REGISTRATION:-true}
      USERS_DISABLE_LOCAL_AUTH: ${USERS_DISABLE_LOCAL_AUTH:-false}
      USERS_TOKEN_VALID_FOR_DAYS: ${USERS_TOKEN_VALID_FOR_DAYS:-90}

      # video games

      # Settings related to GiantBomb.
      VIDEO_GAMES_GIANT_BOMB_API_KEY: ${VIDEO_GAMES_GIANT_BOMB_API_KEY:-}
      # Settings related to IGDB.
      VIDEO_GAMES_IGDB_IMAGE_SIZE: ${VIDEO_GAMES_IGDB_IMAGE_SIZE:-t_original}
      # Settings related to Twitch.
      VIDEO_GAMES_TWITCH_CLIENT_ID: ${VIDEO_GAMES_TWITCH_CLIENT_ID:-}
      VIDEO_GAMES_TWITCH_CLIENT_SECRET: ${VIDEO_GAMES_TWITCH_CLIENT_SECRET:-}
